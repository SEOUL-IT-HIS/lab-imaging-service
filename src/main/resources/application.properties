spring.application.name=lab-imaging-service

spring.datasource.url=jdbc:oracle:thin:@seoulit.pe.kr:1521/freepdb1
spring.datasource.username=lab_imaging
spring.datasource.password=labimaging
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------------
# 타 서비스 연동 (Kafka 도입 전 단계 — REST 직접 호출)
# 팀원별로 각자 로컬 PC에서 서버를 띄우므로 host(IP)가 서로 다르다.
# 기본값은 프론트 next.config.ts 의 rewrite origin 과 동일하게 맞춰뒀고,
# 본인 환경이 다르면 환경변수(APP_PATIENT-SERVICE_HOST 등)나 로컬 설정으로 덮어쓴다.
# ---------------------------------------------------------------------------
app.patient-service.host=192.168.1.149
app.patient-service.port=8080

app.admin-service.host=192.168.1.128
app.admin-service.port=8080

# 공통코드 로컬 캐시 — @Scheduled 갱신 주기 (10분)
app.admin-service.common-code.refresh-interval-ms=600000

# ---------------------------------------------------------------------------
# SeaweedFS 연동 (ZP2-21 촬영/영상판독대기등록)
# Filer HTTP API를 직접 호출한다. 별도 SDK 의존성을 추가하지 않는다.
#
# ⚠ 로컬에서 직접 SeaweedFS 를 띄워야 동작 확인이 된다. 코드에서 자동 실행하지 않는다.
#   실행 방법: weed server -dir=./seaweed-data -filer=true
#   (기본 Filer 포트 8888 — 아래 filer-url 의 기본값과 일치)
#
# ⚠ 이 값이 연결 안 되는 상황(SeaweedFS 미기동 등)은 정상적인 개발 시나리오다.
#   ImageFileService 가 RestClientException 을 LAB055 로 변환해 500 이 아니라
#   400 대의 안내 메시지로 내려준다. (GlobalExceptionHandler 참고)
# ---------------------------------------------------------------------------
app.seaweedfs.filer-url=http://localhost:8888

# ---------------------------------------------------------------------------
# Kafka 연동 — 처방코어(OPD) <-> 검사(LAB)
# 기동 순서: 브로커 -> 백엔드. 반대로 하면 Consumer 가 연결 재시도 로그를 계속 뱉는다.
#
# 시연 중 Kafka 경로가 막히면 app.kafka.enabled 만 false 로 바꾸고 재기동하면
# Consumer/Producer 빈이 생성되지 않아 기존 REST intake 경로만 남는다.
# (끄기 위한 플래그가 아니라 되돌릴 수단이다. 평상시에는 항상 true)
# ---------------------------------------------------------------------------
app.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092

app.kafka.topic.lab-order-requested=opd.lab-order.requested.v1
app.kafka.topic.lab-order-resulted=lab.lab-order.resulted.v1
app.kafka.consumer-group.lab-order-requested=lab-service.lab-order-requested-consumer

# 브로커가 없어도 기동 자체는 되도록 메타데이터 대기 시간을 짧게 둔다.
# (시연 당일 브로커를 늦게 띄우는 상황 대비 — 재시도 로그는 남지만 앱은 죽지 않는다)
spring.kafka.producer.properties.max.block.ms=5000

# 발행 직렬화. 값은 JSON, 키(prescriptionId)는 문자열이다.
# ⚠ JacksonJsonSerializer 다. JsonSerializer 가 아니다.
#   둘은 쓰는 Jackson 이 다르다 — JsonSerializer 는 com.fasterxml(Jackson 2),
#   JacksonJsonSerializer 가 tools.jackson(Jackson 3)이고 Boot 4 는 이쪽이다.
# ⚠ 이 두 줄이 없으면 Boot 기본값(StringSerializer)이 걸려
#   "Can t convert value of class EventEnvelope" 로 발행이 실패한다.
#   DLT 발행도 같은 템플릿을 쓰기 때문에 함께 깨진다. (2026-08-27 실제로 겪음)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
