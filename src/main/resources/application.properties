springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------------
# 세션 저장소 (Redis) — 서비스 간 로그인 공유 (2026-09-16 admin 팀 가이드)
#
# ⚠ 2026-09-16 원격 통합 서버(117.16.154.233) 배포에 맞춰 기본값을 localhost로 바꿨다.
#   인프라(Redis/Kafka/SeaweedFS)와 백엔드 10개가 전부 그 서버 한 대 안에서 함께 뜨므로
#   서로 localhost로 부르면 된다(같은 호스트 안 프로세스 간 통신이지 브라우저가 직접
#   호출하는 주소가 아니다).
# ⚠ 팀원이 개인 PC에서 혼자 개발/테스트할 때는 이 기본값(localhost)이 자기 자신을
#   가리키므로 그대로 두면 안 된다 — IntelliJ 실행구성 환경변수에
#   SPRING_DATA_REDIS_HOST=192.168.1.126 처럼 실제 Redis가 떠 있는 주소를 개인적으로
#   덮어써야 한다(파일은 커밋 공유 값이라 개인 설정을 여기 넣지 않는다).
# ⚠ REDIS_PASSWORD는 setx로 미리 걸어둔 OS 환경변수여야 한다(값은 팀에서 별도 전달).
#   설정 안 하면 로그인 자체가 막힌다 — IntelliJ도 setx 이후 재시작해야 인식한다.
# ---------------------------------------------------------------------------
# ⚠ 원격 통합 서버(117.16.154.233) 빌드용 값. 개인 PC에서 혼자 테스트할 때는
#   위 줄을 주석처리하고 아래 줄(개인 PC용 IP)의 주석을 해제한다.
# spring.data.redis.host=localhost
spring.data.redis.host=192.168.1.126
# spring.data.redis.host=192.168.1.128
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}

# 서버 세션 (JWT 미사용). timeout은 서비스마다 다르면 사람마다 끊기는 시점이 달라지므로
# 팀 전체가 10h로 통일한다.
server.servlet.session.timeout=10h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax

# ---------------------------------------------------------------------------
# 로그인 사용자 연동 (5차 Phase 2, 후속조치 #7)
#
# 담당자ID(입력자·확정자 등)는 로그인 세션(admin 이 넣는 LOGIN_USER)의 empId 로 서버가 채운다.
# 세션이 있으면 요청값은 무시한다.
#
# actor-from-session-required (D2)
#   false(기본, 과도기) : 세션이 없으면 요청값을 쓰고 WARN 로그. Postman·개발 PC 단독 테스트용.
#   true               : 세션이 없으면 401(LAB067). 운영 전환 시 켠다.
# ⚠ 개발 PC 에서 세션 연동까지 확인하려면 admin 과 "같은 Redis"를 봐야 한다(spring.data.redis.*).
#
# forbid-self-confirm (D3) : true 면 결과 입력자 본인이 확정할 수 없다(LAB068). 시연 환경 1인이라 기본 false.
# ---------------------------------------------------------------------------
app.auth.actor-from-session-required=false
app.auth.forbid-self-confirm=false

# ---------------------------------------------------------------------------
# 타 서비스 연동 (admin-service / patient-service)
#
# ⚠ 2026-09-16 원격 통합 서버(117.16.154.233) 배포로 기본값을 localhost로 바꿨다.
#   인프라 + 백엔드 10개가 전부 그 서버 한 대 안에서 뜨므로 서로 localhost로 부르면 된다.
#   (이전에는 팀원마다 개인 PC에서 개별 실행해서 host(IP)가 서로 달랐다 — 그 시절 기본값은
#    192.168.1.x였다)
#
# ⚠ 팀원이 개인 PC에서 혼자 개발/테스트할 때는 이 기본값(localhost)이 자기 자신을
#   가리키므로 그대로 쓰면 안 된다. IntelliJ 실행구성 환경변수에 개인적으로 덮어써야 한다
#   (파일은 커밋 공유 값이라 개인 설정을 여기 넣지 않는다):
#     APP_ADMIN_SERVICE_BASE_URL=http://<admin이 실제로 떠 있는 주소>
#     APP_PATIENT_SERVICE_BASE_URL=http://<patient가 실제로 떠 있는 주소>
#
# patient-service 주소. host+port 두 값 대신 base-url 하나로 합쳤다(2026-09-15).
# ⚠ 원격 통합 서버 빌드용 값. 개인 PC에서 혼자 테스트할 때는 위 줄을 주석처리하고
#   아래 줄(개인 PC용 IP)의 주석을 해제한다.
# app.patient-service.base-url=http://localhost:8087
# app.patient-service.base-url=http://192.168.1.128:8087
# app.patient-service.base-url=http://192.168.1.126:8087
app.patient-service.base-url=http://192.168.1.126:18087

# admin-service 주소. host+port 두 값 대신 base-url 하나로 합쳤다(2026-09-15).
# ⚠ 포트가 8080이 아니라 9090이다 — 원격 통합 서버에서 8080이 이미 다른 데 쓰이고 있어
#   admin의 내부 리스닝 포트 자체가 9090으로 바뀌었다(2026-09-16). 8080은 더 이상 admin이 아니다.
# ⚠ 원격 통합 서버 빌드용 값. 개인 PC에서 혼자 테스트할 때는 위 줄을 주석처리하고
#   아래 줄(개인 PC용 IP:8080)의 주석을 해제한다 — 개인 PC 시절에는 admin이 8080을 썼다.
# app.admin-service.base-url=http://localhost:9191
# app.admin-service.base-url=http://192.168.1.126:9191
# app.admin-service.base-url=http://192.168.1.128:9191
app.admin-service.base-url=http://192.168.1.126:18080

# 공통코드 로컬 캐시 — @Scheduled 갱신 주기 (10분)
app.admin-service.common-code.refresh-interval-ms=600000

# ---------------------------------------------------------------------------
# SeaweedFS 연동 (ZP2-21 촬영/영상판독대기등록)
# Filer HTTP API를 직접 호출한다. 별도 SDK 의존성을 추가하지 않는다.
#
# ⚠ 2026-09-16 원격 통합 서버(117.16.154.233) 배포로 기본값을 localhost로 바꿨다.
#   같은 서버 안에서 SeaweedFS도 함께 뜨므로 localhost로 부르면 된다.
#   포트는 SeaweedFS 기본 Filer 포트(8888) 그대로다.
# ⚠ 개인 PC에서 혼자 테스트할 때는 이 기본값이 자기 자신을 가리키므로, IntelliJ 실행구성
#   환경변수에 APP_SEAWEEDFS_FILER_URL=http://<실제 SeaweedFS 주소>를 개인적으로 덮어써야 한다.
#
# ⚠ 이 값이 연결 안 되는 상황(원격 서버 재기동 등)은 여전히 정상적인 예외 시나리오다.
#   ImageFileService 가 RestClientException 을 LAB055 로 변환해 500 이 아니라
#   400 대의 안내 메시지로 내려준다. (GlobalExceptionHandler 참고)
#
# ⚠ 원격 통합 서버 빌드용 값. 개인 PC에서 혼자 테스트할 때는 위 줄을 주석처리하고
#   아래 줄(개인 PC용 IP)의 주석을 해제한다.
# ---------------------------------------------------------------------------
# app.seaweedfs.filer-url=http://localhost:8888
app.seaweedfs.filer-url=http://192.168.1.126:8888

# ---------------------------------------------------------------------------
# Kafka 연동 — 처방코어(OPD) <-> 검사(LAB)
# 기동 순서: 브로커 -> 백엔드. 반대로 하면 Consumer 가 연결 재시도 로그를 계속 뱉는다.
#
# ⚠ 2026-09-16 원격 통합 서버(117.16.154.233) 배포로 기본값을 localhost로 바꿨다.
#   같은 서버 안에서 Kafka도 함께 뜨므로 localhost로 부르면 된다.
#   개인 PC에서 혼자 테스트할 때는 IntelliJ 실행구성 환경변수에
#   SPRING_KAFKA_BOOTSTRAP_SERVERS=<실제 Kafka 주소>를 개인적으로 덮어써야 한다.
#
# 시연 중 Kafka 경로가 막히면 app.kafka.enabled 만 false 로 바꾸고 재기동하면
# Consumer/Producer 빈이 생성되지 않아 기존 REST intake 경로만 남는다.
# (끄기 위한 플래그이자 되돌릴 수단이다)
#
# ⚠ 원격 통합 서버 빌드용 값. 개인 PC에서 혼자 테스트할 때는 위 줄을 주석처리하고
#   아래 줄(개인 PC용 IP)의 주석을 해제한다.
# ---------------------------------------------------------------------------
app.kafka.enabled=true
# spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.bootstrap-servers=192.168.1.126:9092

app.kafka.topic.lab-order-requested=opd.lab-order.requested.v1
app.kafka.topic.lab-order-resulted=lab.lab-order.resulted.v1
app.kafka.consumer-group.lab-order-requested=lab-service.lab-order-requested-consumer

# 검사결과 확정 -> 수납 청구 이벤트 (수납팀과 확정된 토픽명, 임의 변경 금지)
app.kafka.topic.billing-charge=exam-billing-charge

# 검사결과 보고 (UC-RST-06, 5차 Phase 6 / D9) — 처방코어·응급·병동이 각자 다른 컨슈머 그룹으로 구독한다.
# ⚠ 토픽명·eventType(LabResultReported)은 처방코어(GR2) 제안(2026-09-29)을 따랐다. 응급·병동은 구독 그룹명 회신 대기.
# ⚠ 기존 lab.lab-order.resulted.v1(오더 접수 결과 ACCEPTED/REJECTED 회신)과 다른 토픽이다. 섞지 않는다.
app.kafka.topic.lab-result-reported=lab.lab-result.reported.v1

# 영상오더 연계 수신 (UC-IMG-01, 5차 Phase 8 / D12) — 처방코어(GR2)가 아직 발행하지 않는다. 기본 꺼짐.
# ⚠ true 로 바꾸면 ImageOrderRequestedConsumer·ResultedProducer 와 아래 두 토픽이 생긴다(app.kafka.enabled 도 true 여야 함).
# ⚠ 토픽명·그룹·payload 모양(검사오더와 같다고 가정)은 GR2 와 미합의 "안"이다. 합의되면 이 줄들만 바꾼다.
app.kafka.image-order.enabled=false
app.kafka.topic.image-order-requested=opd.image-order.requested.v1
app.kafka.topic.image-order-resulted=lab.image-order.resulted.v1
app.kafka.consumer-group.image-order-requested=lab-service.image-order-requested-consumer

# 브로커가 없어도 기동 자체는 되도록 메타데이터 대기 시간을 짧게 둔다.
# (시연 당일 브로커를 늦게 띄우는 상황 대비 — 재시도 로그는 남지만 앱은 죽지 않는다)
spring.kafka.producer.properties.max.block.ms=5000

# 발행 직렬화. 값은 JSON, 키(prescriptionId)는 문자열이다.
# ⚠ JacksonJsonSerializer 다. JsonSerializer 가 아니다.
#   둘은 쓰는 Jackson 이 다르다 — JsonSerializer 는 com.fasterxml(Jackson 2),
#   JacksonJsonSerializer 가 tools.jackson(Jackson 3)이고 Boot 4 는 이쪽이다.
# ⚠ 이 두 줄이 없으면 Boot 기본값(StringSerializer)이 걸려
#   "Can t convert value of class EventEnvelope" 로 발행이 실패한다.
#   DLT 발행도 같은 템플릿을 쓰기 때문에 함께 깨진다. (2026-08-27 실제로 겪음)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# ---------------------------------------------------------------------------
# 연계 발신 이력 · 재처리 (INTERFACE_SEND_LOG, 5차 Phase 5 / D8)
#
# 흐름: 업무 트랜잭션 안에서 01(대기) 기록 → 커밋 후 발행 → 02(완료)/03(실패) → 재처리
# retry.* : 03 이거나 stale-pending-minutes 보다 오래된 01 을 max-retry 까지 같은 event_id 로 다시 보낸다.
#           max-retry 를 넘긴 건은 조회 화면에서 수동 재전송한다. Kafka 가 꺼져 있으면 재처리도 돌지 않는다.
#
# billing-system-code : 청구 발신 이력의 수신처(system_code, SYSTEM_SOURCE_CD).
#   ⚠ admin SYSTEM_SOURCE_CD 에 수납 시스템 값이 아직 없다(2026-09-28 실측: 01~05 외래·응급·병동·검사·수술).
#     "06=Billing System" 등록을 요청했다(03_admin_공통코드_등록요청). 다른 번호로 등록되면 이 값만 바꾼다.
#     이력 컬럼 표시용 값이라 발행 자체에는 영향이 없다.
# ---------------------------------------------------------------------------
app.interface-send.billing-system-code=06
app.interface-send.retry.enabled=true
app.interface-send.retry.interval-ms=60000
app.interface-send.retry.max-retry=5
app.interface-send.retry.stale-pending-minutes=5

# ---------------------------------------------------------------------------
# 청구 연동 (검사결과 확정 -> 수납, BillingChargeService → 발신 이력 → Kafka)
#
# ⚠ feeCodeMapping 은 앱 기동 시점에 한 번만 읽힌다(@ConfigurationProperties).
#   매핑을 추가/수정하면 재기동해야 반영된다 — CommonCodeCache 처럼 주기적으로
#   갱신되지 않는다.
# ---------------------------------------------------------------------------

# 발생서비스코드 — 확정값. admin SYSTEM_SOURCE_CD 그룹의 "04=Lab System" (2026-09-09 확정,
# 2026-09-16 주석 정정 — "05" 아님. 이 값 자체는 codeId(UUID)라 숫자코드 오기와 무관하게 처음부터 맞았다)
app.billing.source-service-code=0abe63e3-0425-4259-9ba3-21d7323aae20

# 검사항목코드(labItemCode) -> 수가코드(feeCode) 매핑.
# ⚠ 2026-10-01 수납팀 회신으로 확정(TEST_TYPE_CD 01~08 전체). 테스트용 임시값(FEE002)은 폐기했다.
app.billing.fee-code-mapping.01=LAB001
app.billing.fee-code-mapping.02=LAB002
app.billing.fee-code-mapping.03=LAB003
app.billing.fee-code-mapping.04=LAB004
app.billing.fee-code-mapping.05=LAB005
app.billing.fee-code-mapping.06=LAB006
app.billing.fee-code-mapping.07=LAB007
app.billing.fee-code-mapping.08=LAB008

# 동의 필요 촬영항목 규칙 (UC-IMG-05, 5차 Phase 9-1 / D13) — ConsentRequirementPolicy
# ALL(기본) = 모든 촬영에 동의 필요(5차 이전 동작 그대로) / LISTED = 아래 촬영항목코드(IMG_ITEM_CD)만 동의 필요
# ⚠ admin 공통코드에 "동의필요" 속성이 없어 설정으로 둔다. 모르는 값이면 ALL 로 동작한다(fail-closed).
app.imaging.consent.required-mode=ALL
app.imaging.consent.required-item-codes=

# 영상촬영항목코드(imageItemCode) -> 수가코드 매핑 (5차 Phase 7, D11 — 첫 촬영 완료 시 청구)
# ⚠ 2026-10-01 수납팀 회신으로 확정(IMG_ITEM_CD 01~04 전체).
app.billing.image-fee-code-mapping.01=IMG001
app.billing.image-fee-code-mapping.02=IMG002
app.billing.image-fee-code-mapping.03=IMG003
app.billing.image-fee-code-mapping.04=IMG004

# ---------------------------------------------------------------------------
# 검사항목 결과유형 (5차 D1) — app.lab-result.type.{TEST_TYPE_CD}=MICROBIOLOGY | PATHOLOGY
#
# ⚠ admin 공통코드에 "속성" 컬럼이 없어 코드만으로 유형을 알 수 없다. 여기 적힌 코드만 미생물/병리이고
#   나머지는 전부 일반검사(GENERAL)다.
# ⚠ 05~08 은 admin 등록 "요청값"이다(2026-09-28, 05 Blood Culture / 06 Urine Culture /
#   07 Histopathology / 08 Cytology). admin 이 다른 번호로 등록하면 이 줄만 바꾸고 재기동한다.
# ---------------------------------------------------------------------------
app.lab-result.type.05=MICROBIOLOGY
app.lab-result.type.06=MICROBIOLOGY
app.lab-result.type.07=PATHOLOGY
app.lab-result.type.08=PATHOLOGY
